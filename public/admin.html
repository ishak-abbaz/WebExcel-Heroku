<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panneau administrateur</title>
    <!-- ToDo: Uncomment icon link when icon is ready -->
    <!-- <link rel="icon" type="image/png" href="../FrontEnd/HomePage/clinic_icon.ico"> -->
    <link rel="stylesheet" href="./plugins/fontawesome/css/font_awesome.css">
    <link rel="stylesheet" href="./plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="./plugins/adminlte/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
    <!-- Bottom App Bar  -->
    <div class="wrapper">
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a href="#" class="nav-link">Visiter le site</a>
            </li>
        </ul>
        
        <ul class="navbar-nav ml-auto">
            <div class="card-tools">
                <button type="button" class="btn btn-primary btn-sm" id="uploadBtn">
                    <i class="fas fa-upload"></i> Importer fichier
                </button>
            </div>
        </ul>
        </nav>
        <!-- Side Bar -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="#" class="brand-link">
                <span class="brand-text font-weight-light">Tarraco</span>
            </a>
            <div class="sidebar">
                <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                    <div class="image">
                        <img src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/img/user2-160x160.jpg"
                            class="img-circle elevation-2" alt="User">
                    </div>
                    <div class="info">
                        <a href="#" class="d-block">Amine Telitel</a>
                    </div>
                </div>
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                        <li class="nav-item">
                            <a href="#" class="nav-link active">
                                <i class="nav-icon fas fa-tachometer-alt"></i>
                                <p>Dashboard</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <button type="button" class="nav-link btn btn-link text-left w-100" id="uploadBtn">
                                <i class="nav-icon fas fa-upload"></i>
                                <p class="d-inline">Importer fichier</p>
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>
        
        <div class="content-wrapper">
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">Liste des commandes</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="#">Accueil</a></li>
                                <li class="breadcrumb-item active">Dashboard</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <section class="content">
                <div class="container-fluid">

                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Nombres commands: 5 commande(s)</h3>
                                    <div class="card-tools">
                                        <h3 class="card-title">Prix totale: 13 €</h3>
                                    </div>
                                </div>
                                <div class="card-body table-responsive p-0">
                                    <table class="table table-hover text-nowrap">
                                        <thead>
                                        <tr>
                                            <th>Numero</th>
                                            <th>Client</th>
                                            <th>Date et Heure</th>
                                            <th>Prix Totale</th>
                                            <th>Action</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>1</td>
                                                <td>ishak</td>
                                                <td>Jan 01, 2024 10:00</td>
                                                <td>13 €</td>
                                                <td class="text-nowrap">
                                                    <button type="button" class="btn btn-success btn-sm">
                                                        <i class="fas fa-download"></i> Télécharger
                                                    </button>
                                                    <button type="button" class="btn btn-danger btn-sm">
                                                        <i class="fas fa-trash"></i> Supprimer
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <input type="file" id="fileInput" hidden>
    </div>
    <!-- Administrator JS -->
    <script src="./js/admin.js"></script>
    <!-- Bootstrap & AdminLTE JS -->
    <script src="./plugins/jquery/jquery-3.6.0.min.js"></script>
    <script src="./plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="./plugins/adminlte/adminlte.min.js"></script>
</body>
</html>
