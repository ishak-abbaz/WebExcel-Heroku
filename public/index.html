<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebExcel - Products</title>
    <script src="plugins/jquery/jquery-3.6.0.min.js"></script>
    <link href="plugins/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="plugins/bootstrap/bootstrap-icons.css">
    <link rel="stylesheet" href="css/products.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid px-4">
            <!-- Logo -->
            <span class="brand-text">
                <div class="mb-1 font-weight-bold" style="font-size: 20px; color: #2FA3A1; line-height: 1.3;">Commande & relation clients</div>
                <small class="text-muted" style="font-size: 16px; line-height: 1.2;">
                    Votre commercielle: Amine Telitel
                </small>
            </span>

            <!-- Search Bar -->
            <div class="search-container ms-auto me-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="Chercher produit">
                    <button class="btn btn-teal" type="button">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>

            <!-- Cart Toggle Button -->
            <button class="btn btn-teal" type="button" id="cartToggleBtn">
                <i class="bi bi-cart3"></i>
                <span class="badge bg-light text-dark ms-1" id="cartCount">0</span>
            </button>

            <!-- Language Selector -->
            <select class="form-select form-select-sm ms-3" style="width: auto;">
                <option selected>Français</option>
                <option disabled style="color: #999;">English (soon)</option>
            </select>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid">
        <div class="row">
            <!-- Products Grid (Left Side) -->
            <div class="col-12 col-lg-9" id="productsSection">
                <div class="p-4">
                    
                    <!-- Products Grid -->
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3" id="productsGrid">
                        <!-- Products will be loaded here by products.js -->
                    </div>
                    
                </div>
            </div>

            <!-- Cart Sidebar (Right Side) -->
            <div class="col-12 col-lg-3 cart-sidebar" id="cartSidebar">
                <div class="cart-content">
                    <!-- Cart Header -->
                    <div class="cart-header border-bottom pb-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="bi bi-cart3 me-2"></i>
                                Panier
                            </h5>
                            <button class="btn btn-sm btn-link text-danger clear-cart" id="clearCartBtn">
                                <i class="bi bi-trash trash-icon"></i>
                            </button>
                        </div>
                        <small class="text-muted">Total: <span id="cartTotal">0 €</span></small>
                    </div>

                    <!-- Cart Items -->
                    <div class="cart-items" id="cartItems">
                        <!-- Cart items will be loaded here by products.js -->
                        <div class="text-center text-muted py-5" id="emptyCartMessage">
                            <i class="bi bi-cart-x fs-1 d-block mb-2"></i>
                            <p>Votre panier est vide</p>
                        </div>
                    </div>

                    <!-- Cart Order Validation Button -->
                    <div class="cart-footer border-top pt-3 mt-auto">
                        <button class="btn btn-teal w-100" id="validateOrderBtn">
                            <i class="bi bi-check-circle me-2"></i>
                            Valider la commande
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Overlay (for mobile) -->
    <div class="cart-overlay" id="cartOverlay"></div>

    <!-- Product Details Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0" >
                    <button id="modalBtnClose" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <!-- Product Image -->
                        <div class="col-md-5">
                            <img id="modalProductImage" src="" class="img-fluid border rounded" alt="">
                        </div>
                        
                        <!-- Product Details -->
                        <div class="col-md-7">
                            <h5 id="modalProductTitle" class="mb-3"></h5>
                            <h3 id="modalProductPrice" class="text-primary mb-2"></h3>
                            <p id="modalProductStock" class="text-success mb-3"></p>
                            
                            <!-- Details Table -->
                            <table class="table table-sm table-bordered">
                                <tbody id="modalProductDetails">
                                </tbody>
                            </table>
                            
                            <!-- Quantity Controls -->
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <button class="btn btn-teal" id="modalBtnDecrease">-</button>
                                <input type="number" class="form-control text-center" id="modalQuantity" value="0" min="0" style="max-width: 80px;">
                                <button class="btn btn-teal" id="modalBtnIncrease">+</button>
                            </div>
                            
                            <!-- Total Price -->
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5>Totale: <span id="modalTotal">0 €</span></h5>
                            </div>
                            <!-- Add to Cart Button -->
                            <button class="btn btn-success w-100" id="modalAddToCart">
                                🛒 Ajouter au panier
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="plugins/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
